# One generation config for every language, so all consumers stay in lockstep.
# `buf generate` writes strongly typed artifacts into ../gen and nothing ever
# reads a .proto at runtime.
#
# Plugin versions are pinned for the same reason tool versions are pinned
# everywhere else: a floating plugin silently changes generated code between
# a developer's machine and CI.
version: v2

managed:
  enabled: true

plugins:
  # TypeScript: @bufbuild/protobuf. Emits *_pb.ts with real types, no runtime
  # descriptor parsing.
  - remote: buf.build/bufbuild/es:v2.9.0
    out: ../gen/ts
    opt:
      - target=ts
      - import_extension=.js

  # Rust: prost. tonic is deliberately absent. Arsox serves protobuf over
  # ordinary HTTP rather than gRPC, so there are no service definitions to
  # generate stubs from.
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: ../gen/rust/src

  # prost emits one flat file per package and no module tree. This writes the
  # `mod.rs` wiring that turns those files into a crate the Rust SDK can
  # actually depend on.
  - remote: buf.build/community/neoeinstein-prost-crate:v0.5.0
    out: ../gen/rust/src
    opt:
      - no_features

  # Python: the upstream protobuf plugin plus type stubs, so the Python SDK is
  # checkable by mypy rather than dynamically typed at the boundary.
  - remote: buf.build/protocolbuffers/python:v33.1
    out: ../gen/python
  - remote: buf.build/protocolbuffers/pyi:v33.1
    out: ../gen/python
