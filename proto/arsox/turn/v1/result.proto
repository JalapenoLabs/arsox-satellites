syntax = "proto3";

package arsox.turn.v1;

import "arsox/artifact/v1/artifact.proto";
import "arsox/common/v1/common.proto";
import "arsox/error/v1/error.proto";
import "arsox/incident/v1/incident.proto";
import "arsox/interaction/v1/question.proto";
import "arsox/suggestion/v1/suggestion.proto";
import "arsox/turn/v1/turn.proto";
import "arsox/usage/v1/usage.proto";

// A stage of the per-turn stack.
enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_PLAN = 1;
  STAGE_TEAM_WORK = 2;
  STAGE_CHECKERS = 3;
  STAGE_SELF_REVIEW = 4;
  STAGE_MERGE = 5;
  STAGE_ARTIFACTS = 6;
  STAGE_SUGGESTIONS = 7;
  STAGE_PULL_REQUEST_WATCH = 8;
}

enum StageDisposition {
  STAGE_DISPOSITION_UNSPECIFIED = 0;
  STAGE_DISPOSITION_RAN = 1;
  STAGE_DISPOSITION_SKIPPED = 2;
  STAGE_DISPOSITION_FAILED = 3;
}

// What each stage of the stack actually did.
//
// Post-turn stages cost tokens, so an exhausted budget skips self-review and
// suggestions rather than breaching the ceiling you set. Recording the skip is
// what stops "the budget ran out" reading as "there was nothing to suggest".
// Artifact scanning and upload still run, because losing work you already paid
// for to save a few tokens is the wrong trade.
message StageOutcome {
  Stage stage = 1;
  StageDisposition disposition = 2;

  // Why it was skipped or how it failed. Absent when it simply ran.
  optional string reason = 3;

  // Wall clock the stage consumed. Zero for a stage that was skipped.
  arsox.common.v1.Duration elapsed = 4;
}

// Why the agent stopped producing output.
//
// Distinct from `TurnStatus`, which says what happened to the turn. A turn can
// be COMPLETED while the model was cut off mid-sentence at its output ceiling,
// and a consumer that shows the result to a human needs to know the difference
// between "it finished" and "it ran out of room".
enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;

  // The agent decided it was done.
  STOP_REASON_END_TURN = 1;

  // The model's output ceiling was reached. The answer is truncated.
  STOP_REASON_MAX_TOKENS = 2;

  // A configured stop sequence was produced.
  STOP_REASON_STOP_SEQUENCE = 3;

  // The model declined to continue.
  STOP_REASON_REFUSAL = 4;
}

// Where a turn's wall clock actually went.
//
// `Turn.started_at` and `finished_at` bound the turn, and say nothing about how
// the time inside was spent. The split between waiting on a model and running
// tools is what tells you whether a slow turn is a slow provider or a slow test
// suite, and those have opposite fixes.
message TurnTiming {
  // Start to terminal state, including queue-free time only.
  arsox.common.v1.Duration total = 1;

  // Time spent waiting on model responses. Absent when the harness does not
  // separate it from tool execution.
  optional arsox.common.v1.Duration llm = 2;

  // Time from turn start to the first token of the first response. The number a
  // human perceives as responsiveness.
  optional arsox.common.v1.Duration time_to_first_token = 3;

  // How many model round trips the harness needed.
  //
  // Deliberately not called "turns". A harness counts a request and its response
  // as a turn; Arsox counts a whole unit of work as a turn. Reusing the word
  // here would put two different meanings on one field name in one contract.
  optional uint32 model_round_trips = 4;
}

// How a pull request watch window resolved.
message PullRequestWatchReport {
  uint32 pull_request_number = 1;

  // How many times the team was put back to work on a failing check run.
  uint32 attempts_used = 2;

  // Whether checks were green when watching stopped.
  bool checks_passed = 3;

  // Plain language: passed, attempts exhausted, budget exhausted, PR merged or
  // closed, window elapsed, or cancelled. Always populated, because the reason
  // is in the report every time.
  string termination_reason = 4;
}

// Everything one turn produced.
message TurnResult {
  string turn_id = 1;
  string thread_id = 2;

  TurnStatus status = 3;

  // The commander's account of what it did, in markdown.
  string summary = 4;

  // Every agent in the turn, every endpoint, combined.
  arsox.usage.v1.TokenUsage tokens = 5;
  arsox.usage.v1.CostEstimate cost = 6;

  // The same totals split by the model that actually answered.
  //
  // Without this, failover is invisible in the accounting. A turn where the
  // first endpoint burned two million tokens failing and the second did the real
  // work looks identical to a clean run on the second, and the failover tax the
  // README warns about is exactly the number you cannot see. A `recovered`
  // incident says failover happened; this says what it cost.
  repeated arsox.usage.v1.ModelStatistics by_model = 19;

  // Why the turn ended early. Absent on a turn that completed.
  optional arsox.error.v1.Error error = 7;

  // Counts by disposition, so the common case needs no incident query at all.
  arsox.incident.v1.IncidentCounts incident_counts = 8;

  repeated TeamMember members = 9;
  repeated ChangedFile changed_files = 10;
  repeated IntegrationRecord integrations = 11;
  repeated CheckerResult checker_results = 12;

  repeated arsox.artifact.v1.Artifact artifacts = 13;

  // Empty when the suggestions stage was off or skipped. `stages` says which.
  arsox.suggestion.v1.SuggestionReport suggestions = 14;

  // What every stage of the stack did, including the ones that did nothing.
  repeated StageOutcome stages = 15;

  // Questions the commander asked that nobody answered before the timeout. The
  // turn ends with them recorded here rather than hanging forever.
  repeated arsox.interaction.v1.QuestionSet unanswered_questions = 16;

  // Present when pull request watching ran.
  optional PullRequestWatchReport watch = 17;

  // The agents repo commit this turn actually ran against, resolved from `ref`.
  // Absent when no agents repo was configured.
  optional string agents_repo_commit = 18;

  // The turn's `metadata`, repeated here rather than referenced.
  //
  // A consumer reacting to `turn.completed` receives only this message, and
  // "which customer's job just finished" is precisely the question it needs to
  // answer at that moment. Making it look up the Turn first would defeat the
  // point of carrying correlation data at all.
  map<string, string> metadata = 20;

  // Where the turn's wall clock went.
  TurnTiming timing = 21;

  // Why the agent stopped. Absent when the harness does not report it, and on a
  // turn that ended for a reason of the satellite's own, such as a cancellation
  // or an exhausted budget: `status` and `error` cover those.
  optional StopReason stop_reason = 22;

  // Where the run stood against provider quotas when it ended.
  //
  // Absent when no endpoint reported quota state. Worth reading on a turn that
  // was unexpectedly slow, since throttling and hard work look the same from
  // the outside.
  optional arsox.usage.v1.RateLimitStatus rate_limits = 23;
}

message GetTurnRequest {
  string thread_id = 1;
  string turn_id = 2;
}

message GetTurnResponse {
  Turn turn = 1;

  // Absent until the turn reaches a terminal state.
  optional TurnResult result = 2;
}
