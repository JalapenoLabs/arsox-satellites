syntax = "proto3";

// A conversation, its workspace, and its queue.
//
// A thread lives entirely on the satellite. The SDK client holds no thread
// state, only a handle, which means any process holding the satellite URL, the
// secret, and the thread ID can attach to a running thread. There is no
// handoff, no lease, and no ownership: the process that created the thread has
// no privileged claim on it and may have exited hours ago.
package arsox.thread.v1;

import "arsox/common/v1/common.proto";
import "arsox/interaction/v1/plan.proto";
import "arsox/interaction/v1/question.proto";
import "arsox/settings/v1/settings.proto";

// Where a thread is in its life.
//
// This is the state machine the queue arbitrates against. A turn submitted
// while one is RUNNING is queued rather than run in parallel, and a turn
// submitted while the satellite is running its own watch-triggered turn is
// queued behind it exactly the same way. There is no state in which two turns
// execute at once.
enum ThreadState {
  THREAD_STATE_UNSPECIFIED = 0;

  // Cloning repos and the agents repo, prefetching issues, assembling
  // AGENTS.md, running setup commands. Turns may be queued and start once this
  // completes.
  THREAD_STATE_PROVISIONING = 1;

  // Alive with nothing running. The idle TTL is counting down.
  THREAD_STATE_IDLE = 2;

  THREAD_STATE_RUNNING = 3;

  // A turn is running but blocked on a question set or a plan decision. The
  // question timeout is counting down.
  THREAD_STATE_AWAITING_INPUT = 4;

  // A pull request watch window is open. Watching counts as activity, so the
  // idle TTL does not run and the thread cannot be collected out from under the
  // pull request it is watching.
  THREAD_STATE_WATCHING = 5;

  // The idle TTL elapsed and the workspace was collected. Incidents and
  // lifetime statistics survive on their own retention.
  THREAD_STATE_EXPIRED = 6;

  THREAD_STATE_DESTROYED = 7;
}

// One thread's current state.
message Thread {
  // Always generated by the satellite as UUIDv7 and never accepted from the
  // client. Thread IDs become filesystem paths, so a client-supplied one is a
  // path traversal waiting to happen. UUIDv7 also sorts by creation time, which
  // makes listing threads naturally chronological.
  string thread_id = 1;

  ThreadState state = 2;

  // The settings the thread was created with, as the satellite resolved them.
  // Defaults the client left absent are filled in here.
  arsox.settings.v1.ThreadSettings settings = 3;

  arsox.common.v1.Timestamp created_at = 4;

  // Resets on every turn and on any SDK interaction with the thread. What the
  // idle TTL is measured from.
  arsox.common.v1.Timestamp last_activity_at = 5;

  // When the idle TTL will collect this thread if nothing touches it. Absent
  // while a turn or a watch window is holding the clock.
  optional arsox.common.v1.Timestamp expires_at = 6;

  // Turns waiting behind the running one. Further submissions past the cap are
  // rejected with TURN_QUEUE_FULL rather than accumulating without bound.
  uint32 queue_depth = 7;

  // Absent when nothing is running.
  optional string current_turn_id = 8;

  // The question set the thread is blocked on. Absent unless the state is
  // AWAITING_INPUT and the block is a question rather than a plan.
  optional arsox.interaction.v1.QuestionSet pending_questions = 9;

  // The plan awaiting a decision. Absent unless the state is AWAITING_INPUT and
  // the block is a plan rather than a question.
  optional arsox.interaction.v1.Plan pending_plan = 10;

  // Highest sequence number emitted on this thread's stream so far. Persist it
  // alongside the thread ID and a replica that picks the thread back up can
  // reconnect with `from_sequence` and lose nothing.
  uint64 latest_sequence = 11;
}

// POST /v1/threads
message CreateThreadRequest {
  arsox.settings.v1.ThreadSettings settings = 1;

  // Deduplicates retries of this call. A second request carrying a key the
  // satellite has already seen returns the original thread rather than
  // provisioning a second workspace.
  //
  // Without this, a create that times out in transit leaves the caller unable
  // to tell "not created" from "created, response lost", and the only safe move
  // is to retry and leak a whole workspace.
  optional string idempotency_key = 2;
}

message CreateThreadResponse {
  Thread thread = 1;

  // True when `idempotency_key` matched an existing thread and this response is
  // that thread rather than a new one.
  bool deduplicated = 2;
}

message GetThreadRequest {
  string thread_id = 1;
}

message GetThreadResponse {
  Thread thread = 1;
}

message ListThreadsRequest {
  repeated ThreadState states = 1;
  arsox.common.v1.PageRequest page = 2;
}

message ListThreadsResponse {
  // Naturally chronological, because thread IDs are UUIDv7.
  repeated Thread threads = 1;
  arsox.common.v1.PageResponse page = 2;
}

// DELETE /v1/threads/{thread_id}
//
// Removes the entire workspace subtree, including member worktrees and any
// artifacts that were never downloaded. Incidents and lifetime statistics
// survive: "why did last night's run go wrong" is asked after the workspace is
// gone.
message DestroyThreadRequest {
  string thread_id = 1;
}

message DestroyThreadResponse {
  Thread thread = 1;
}
