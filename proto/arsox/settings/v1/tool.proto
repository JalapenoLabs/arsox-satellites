syntax = "proto3";

package arsox.settings.v1;

import "arsox/common/v1/common.proto";

// A server whose tools the agents may use.
//
// Arsox provides its own MCP tools alongside these, including team spawn and
// despawn, request_integration, and override_redaction. Those are MCP schemas
// offered to the agents rather than part of this contract, so they are not
// defined anywhere in these files.
//
// A server is reached at a literal `url`, or at one of the thread's own
// services through `service`. Exactly one of the two is set.
message McpServer {
  string name = 1;

  // Where the server listens, over streamable HTTP. Empty when `service` is set.
  string url = 2;

  // Sent on every request to the server. Header values are credentials far more
  // often than not, so they carry the same type as every other credential and
  // come back redacted.
  map<string, arsox.common.v1.Secret> headers = 3;

  // A server run by one of the thread's services, for an address that only
  // exists once the turn has started it. Absent when `url` is set.
  optional ServiceEndpoint service = 4;
}

// An MCP server served by one of the thread's own services.
//
// The satellite renders it as `http://127.0.0.1:<port><path>`, with the port the
// service was given for the turn. Loopback, so an agent reaches it directly and
// never through the egress proxy.
message ServiceEndpoint {
  // The `name` of a service declared in `ThreadSettings.services`.
  string service = 1;

  // The path the server answers on, starting with `/`, such as `/mcp`.
  string path = 2;
}

// A server whose tools the host application answers itself, over the relay.
//
// A `McpServer` is something the satellite reaches. A relayed server runs the
// other way: the host application is frequently not reachable from a satellite
// at all, so it declares the tools here and answers each call over the relay
// socket it opened to the satellite, `/v1/threads/{id}/relay`. The satellite
// serves the server to the agents on its own loopback proxy, lists the tools
// from these settings, and forwards each call to whichever client is attached.
//
// Names share one namespace with `mcp_servers`: the two lists may not declare
// the same name, ignoring case.
message RelayedMcpServer {
  // Same rule as `McpServer.name`: 1 to 64 of `A-Z a-z 0-9 _ -`, not starting
  // with `arsox`.
  string name = 1;

  // Shown to the agent when its harness connects, saying what the server is
  // for. Empty sends none.
  string instructions = 2;

  repeated RelayedTool tools = 3;
}

// One tool a relayed server offers.
message RelayedTool {
  // 1 to 64 of `A-Z a-z 0-9 _ -`, unique within its server.
  string name = 1;

  // What the model reads to decide when to call the tool.
  string description = 2;

  // A JSON Schema object describing the tool's arguments, serialized as JSON.
  //
  // A string rather than a `google.protobuf.Struct`, because a schema is a JSON
  // document the host application already holds as JSON, and a round trip
  // through Struct turns every integer into a float.
  string input_schema_json = 3;
}

enum Viewport {
  VIEWPORT_UNSPECIFIED = 0;
  VIEWPORT_MOBILE = 1;
  VIEWPORT_TABLET = 2;
  VIEWPORT_DESKTOP = 3;
}

// Headless Chrome, so frontend and QA work is not done blind.
//
// EXPERIMENTAL. Opt in, default off. Each member gets its own browser context
// rather than its own browser process: contexts are isolated in cookies,
// storage, and session while sharing one Chrome, which keeps memory sane when
// several members are looking at pages at once. Chrome is memory-hungry, which
// is part of why this is off by default.
//
// The browser points at declared services through the same ARSOX_SERVICE_*
// addresses, so "run the app and look at it" is two features composing rather
// than one reimplementing the other.
//
// Screenshots are for an agent to look at and a human to review. Do not diff
// them byte for byte: font rendering and compositing vary between runs.
message VirtualBrowser {
  bool enabled = 1;

  // Roles permitted to drive it. Empty permits every member.
  repeated string allowed_roles = 2;

  repeated Viewport viewports = 3;
}
