syntax = "proto3";

package arsox.settings.v1;

// Lets the agents use `gh`. Highly recommended.
//
// Merge permission lives in PullRequestPolicy, not here, so there is exactly one
// place that decides whether a merge may happen.
//
// GitHub is supported first-class. The integration is built polymorphically so
// GitLab and Bitbucket can follow.
message GithubIntegration {
  string token = 1;
}

// Lets the agents look up and act on Jira items.
message JiraIntegration {
  string token = 1;

  // e.g. "https://your-org.atlassian.net".
  string base_url = 2;

  // Required by Atlassian Cloud, which authenticates with an email plus an API
  // token. Absent for Data Center, which accepts the token alone.
  optional string email = 3;

  // Absent means allowed.
  optional bool allow_status_transitions = 4;

  // Absent means allowed.
  optional bool allow_comments = 5;
}
