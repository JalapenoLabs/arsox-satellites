syntax = "proto3";

package arsox.settings.v1;

import "arsox/common/v1/common.proto";

// An environment variable for the agents.
//
// ARSOX_SECRET is never among them. It is read by the satellite process at boot
// and withheld from every harness, member, and brokered command: an agent that
// could read it could command its own satellite.
message EnvVar {
  string key = 1;

  // Carries the credential type even for values marked public, so one rule
  // covers the whole contract: `value` goes up, `display` comes back. For a
  // public value the redaction is a no-op and `display` is the plaintext.
  arsox.common.v1.Secret value = 2;

  // Absent means secret. Defaulting to secret fails safe: the cost of
  // needlessly redacting a public value is a confusing log line, and the cost of
  // the reverse is a leaked credential.
  optional bool is_secret = 3;
}

// How much of a secret is revealed where a secret would otherwise appear.
//
// Two safety rules override every mode: a secret shorter than 8 characters is
// always anonymous, because there is no safe prefix of a short secret, and a
// reveal that would expose more than half the secret falls back to anonymous.
enum RedactionMode {
  REDACTION_MODE_UNSPECIFIED = 0;

  // Reveal nothing.
  REDACTION_MODE_ANONYMOUS = 1;

  // First N characters, N = floor(min(8, 0.20 * length)).
  REDACTION_MODE_PREFIX_SHOWN = 2;

  // Last N characters, same N. Usually the most useful when you need to tell two
  // credentials apart in a log, because the tail of a key is distinguishing
  // while the head is often a shared vendor prefix.
  REDACTION_MODE_POSTFIX_SHOWN = 3;

  // First and last N, N = max(1, floor(min(5, 0.10 * length))).
  REDACTION_MODE_HYBRID_SHOWN = 4;
}

// Mirror the redacted value's length, one star per hidden character.
//
// Be deliberate about this. Mirroring the length leaks the length, which is real
// information about a credential, and it is why a fixed count is the default.
message MirrorLength {}

// How many stars the mask is made of.
message StarCount {
  oneof style {
    // Exactly this many stars, independent of the secret's length. Clamped to at
    // least 1, because a mask with no stars is invisible. Absent uses 6.
    uint32 fixed = 1;

    MirrorLength mirror = 2;
  }
}

// Where and how secrets are hidden on the way out of the satellite.
//
// Redaction covers stream events, reports, team chat and direct messages,
// checker output and command logs, file contents in commits and commit messages,
// PR titles and bodies and review comments, Jira comments, artifact contents at
// upload time, and suggestion bodies. The stream is the obvious channel and the
// least dangerous one: a secret committed to a repo and pushed is the leak that
// actually hurts, and the root-owned pre-push hook is the hard gate for that.
message Redaction {
  RedactionMode mode = 1;

  StarCount star_count = 2;

  // The kill switch. Absent means available.
  //
  // False unregisters the override_redaction tool entirely for this thread, so
  // no agent in it can override redaction for any secret for any reason, no
  // matter what it is told. Removing the tool is strictly stronger than gating
  // its behavior: a gate can be talked around, because a persuasive prompt is
  // exactly the thing a gate has to evaluate. An absent tool cannot be.
  //
  // Set it false when a thread runs prompts you do not fully control, or when
  // the repos it can push to are ones where a single leaked credential is
  // unacceptable.
  optional bool allow_redaction_override = 3;
}
