syntax = "proto3";

package arsox.settings.v1;

// What one turn may decide for itself.
//
// Everything else in `ThreadSettings` is fixed for the life of a thread, which
// is right for the settings that provision a workspace or install a gate: those
// decide what the thread *is*. Which model answers, and how hard it is asked to
// think, are decisions per instruction rather than per thread. Asking a cheap
// model to rename a variable and an expensive one to design a migration is the
// same conversation, and a caller that had to open a second thread to change
// model would lose the first one's context to say so.
//
// Absent fields inherit: a turn's overrides win over the thread's
// `turn_defaults`, and what neither names is left to the harness CLI's own
// default. `ModelEndpoint.model` is not part of that chain. It names what an
// endpoint serves, and which endpoint answers is not known until one does, so a
// flag fixed at spawn cannot be read from a list the proxy may fail over.
message TurnOverrides {
  // The model identifier to ask for, in the harness's own vocabulary: an alias
  // such as "opus" or a full name such as "claude-opus-5".
  //
  // Not validated against a list here. Model names are the provider's to change
  // and a satellite that refused an unknown one would need a release to accept
  // a model that shipped that morning. An endpoint that does not serve it
  // answers 404, which the proxy already records as `LLM_MODEL_UNKNOWN`.
  optional string model = 1;

  // How much reasoning to spend before answering.
  optional Effort effort = 2;
}

// How hard an agent is asked to think.
//
// The scale is Claude's, which is the wider of the two: `claude --effort` takes
// all five. Codex's `model_reasoning_effort` stops at high, so XHIGH and MAX
// reach it as high rather than as a value its CLI would refuse. Naming the
// richer scale and narrowing it in the arm that needs to is the same choice the
// permission posture makes.
enum Effort {
  EFFORT_UNSPECIFIED = 0;
  EFFORT_LOW = 1;
  EFFORT_MEDIUM = 2;
  EFFORT_HIGH = 3;
  EFFORT_XHIGH = 4;
  EFFORT_MAX = 5;
}
