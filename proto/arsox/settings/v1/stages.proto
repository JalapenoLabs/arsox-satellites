syntax = "proto3";

package arsox.settings.v1;

import "arsox/common/v1/common.proto";

// A dedicated agent with a clean context window drafts a plan before any work
// begins, even in team mode.
//
// EXPERIMENTAL. Opt in, default off. Where the harness has no native plan mode
// Arsox supplies a skill fallback, and the output is normalized to the same
// shape either way. The planning agent may also decide a plan is unnecessary
// and skip the step.
message PlanMode {
  bool enabled = 1;

  // Treat every plan as approved without sending it for review. Also implied
  // when human in the loop is disabled.
  bool auto_approve = 2;
}

// Whether the agents may ask a human for approvals and clarification.
//
// Only the commander asks. Team members escalate to it, and it decides whether a
// question is worth your attention. Without that funnel, eight members would
// each queue their own.
message HumanInTheLoop {
  // Absent means enabled. Disabling it leaves the agents to their own judgment
  // for the whole task, which is more dangerous and is the implementer's call.
  optional bool enabled = 1;

  // Past this, the turn ends with the questions recorded in the report rather
  // than hanging forever. Absent uses the satellite's default.
  optional arsox.common.v1.Duration question_timeout = 2;
}

// A dedicated agent with a clean context window reviews the changes.
//
// EXPERIMENTAL. Opt in, default off. Attached to a pull request it leaves its
// review as PR comments; otherwise it writes the review to a file for the agents
// to act on. With no file output there is nothing to review and the step is
// skipped.
message SelfReview {
  bool enabled = 1;
}

// Report what could be better next time, as structured data rather than
// artifacts.
//
// EXPERIMENTAL. Opt in, default off.
message SuggestionSettings {
  bool enabled = 1;

  // Absent uses 5. Any real codebase can produce fifty findings, and fifty per
  // turn is noise that teaches your users to ignore the feature. The cap forces
  // the agent to rank rather than enumerate.
  optional uint32 max_per_category = 2;
}
