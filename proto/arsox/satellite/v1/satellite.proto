syntax = "proto3";

// The satellite itself: version, health, and what it is currently doing.
package arsox.satellite.v1;

import "arsox/common/v1/common.proto";
import "arsox/thread/v1/thread.proto";

// GET /v1/version
//
// Unauthenticated, and exposes no thread content and no configuration. An
// orchestrator needs these facts before it holds a credential.
message GetVersionResponse {
  // The satellite image's own version, e.g. "1.0.0".
  string satellite_version = 1;

  // The proto contract major version this satellite serves. An SDK refuses to
  // talk to a higher major and says so clearly, rather than failing later with
  // a confusing decode error.
  uint32 proto_major = 2;

  // The proto contract minor version. An SDK talking to a higher minor warns
  // once and proceeds, ignoring additive fields it does not know about.
  uint32 proto_minor = 3;
}

// One thing readiness depends on.
message ReadinessCheck {
  // "database", "workspace", "llm_proxy".
  string name = 1;

  bool passing = 2;

  // Why it is failing. Absent when it passes.
  optional string detail = 3;
}

// GET /readyz
//
// Database open, /workspace writable, LLM proxy reachable. Distinct from
// /healthz, which is liveness only and never touches the database.
message GetReadinessResponse {
  bool ready = 1;
  repeated ReadinessCheck checks = 2;
}

// Disk the satellite is holding, across every thread.
//
// Per-thread quotas stop one runaway workspace, and they do not stop forty
// well-behaved ones from filling a volume between them. This is what an
// orchestrator watches to decide it needs another satellite.
message DiskUsage {
  // Total bytes under /workspace right now.
  uint64 workspace_bytes = 1;

  // Bytes the volume has left, as the filesystem reports it.
  uint64 available_bytes = 2;

  // The satellite-wide ceiling, when one is configured. Absent means the
  // volume's own capacity is the only limit.
  optional uint64 aggregate_quota_bytes = 3;

  // Bytes held by the embedded database, which grows with retained events,
  // incidents, and lifetime statistics rather than with workspace contents.
  uint64 database_bytes = 4;
}

// GET /v1/status
message GetStatusResponse {
  string satellite_version = 1;

  // ARSOX_MAX_CONCURRENT_THREADS. Team mode multiplies the real process count
  // behind each one.
  uint32 max_concurrent_threads = 2;

  // Threads currently running a turn, against the cap above.
  uint32 running_threads = 3;

  // Every thread the satellite still holds, whatever its state.
  //
  // Summaries rather than full threads: this endpoint gets polled, and a
  // configuration dump per thread is the wrong payload for an operational
  // question.
  repeated arsox.thread.v1.ThreadSummary threads = 4;

  arsox.common.v1.Timestamp started_at = 5;

  // Whether the satellite is running without a secret because
  // ARSOX_ALLOW_INSECURE was set. Reported so an operator can see it from the
  // API rather than only in the boot log.
  bool insecure_mode = 6;

  DiskUsage disk = 7;
}
