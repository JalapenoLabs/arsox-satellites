syntax = "proto3";

package arsox.satellite.v1;

import "arsox/common/v1/common.proto";

// Where the satellite's setup script stands.
//
// The setup script is the host application's own install script for the
// satellite, set with PUT /v1/setup and run as root. It is how a host installs
// tooling the image does not ship, at runtime rather than in a Dockerfile.
enum SetupState {
  SETUP_STATE_UNSPECIFIED = 0;

  // No script is set. Nothing runs and nothing waits.
  SETUP_STATE_NONE = 1;

  // The script is running. No turn is claimed and no thread starts
  // provisioning until it finishes. Turns already running carry on.
  SETUP_STATE_RUNNING = 2;

  // The script exited zero.
  SETUP_STATE_SUCCEEDED = 3;

  // The script exited nonzero, was killed at its bound, or could not start.
  // Work proceeds anyway, and a SETUP_FAILED incident carries the evidence.
  SETUP_STATE_FAILED = 4;
}

// The setup script's current state, and what its last run left behind.
message SetupStatus {
  SetupState state = 1;

  // The SHA-256 of the script, as lowercase hex. Empty when no script is set.
  // A host compares this against its own script to know whether the satellite
  // already holds it.
  string script_sha256 = 2;

  // The script's exit code. Absent while it runs, and when it never exited on
  // its own: killed at its bound, stopped by a signal, or never started.
  optional int32 exit_code = 3;

  // The end of what the script printed, stdout and stderr together, oldest
  // lines dropped first past 16 KiB. The error is at the end of an install log
  // and the preamble is a package list.
  string output_tail = 4;

  // When the current run started. Absent when no script is set.
  optional arsox.common.v1.Timestamp started_at = 5;

  // When the current run finished. Absent while it runs and when no script is
  // set.
  optional arsox.common.v1.Timestamp finished_at = 6;
}

// PUT /v1/setup
//
// Setting the script the satellite already holds changes nothing and answers
// with its status. A different script replaces it: a run in progress is
// stopped, and the new one starts at once. An empty script clears it.
message SetSetupScriptRequest {
  // Shell text, run as `sh <file>`. Idempotency is the script's job, because it
  // runs again on every container start.
  string script = 1;
}

message SetSetupScriptResponse {
  SetupStatus setup = 1;
}
