syntax = "proto3";

// Shared vocabulary for every Arsox domain.
//
// Nothing here knows about threads, turns, or harnesses. These are the
// primitives that would otherwise be redefined slightly differently in five
// places: an instant, a span, an amount of money, a page of results, and the
// deliberate absence of a ceiling.
package arsox.common.v1;

// An absolute instant on the UTC timeline, plus the zone it should be shown in.
//
// Every timestamp Arsox emits is UTC. `timezone` is presentational and never
// changes the instant, only how a client renders it.
message Timestamp {
  // Seconds since the Unix epoch (1970-01-01T00:00:00Z), always UTC. May be
  // negative.
  int64 epoch_seconds = 1;

  // Nanosecond fraction of a second, in [0, 999_999_999]. Never negative.
  uint32 nanos = 2;

  // IANA timezone name for display, e.g. "America/Denver" or "Etc/UTC".
  // Defaults to "Etc/UTC" when the originating zone is unknown.
  string timezone = 3;
}

// A span of time, with no zone and no anchor on the timeline.
//
// Used for every configurable interval in Arsox: timeouts, backoff, TTLs, poll
// intervals. A bare integer of unstated units is exactly the ambiguity this
// exists to remove.
message Duration {
  // Whole seconds. May be negative.
  int64 seconds = 1;

  // Nanosecond fraction, in [-999_999_999, 999_999_999], same sign as
  // `seconds`.
  int32 nanos = 2;
}

// An amount of money, in integer units. Never a float.
//
// LLM spend is reported and capped in this shape. Nanosecond-style fractional
// units matter here rather than being pedantry: a single model request can cost
// a small fraction of a cent, and accumulating those in a float is how a cost
// ceiling drifts away from the invoice it was meant to predict.
message Money {
  // ISO 4217 currency code, e.g. "USD".
  string currency_code = 1;

  // Whole currency units. May be negative.
  int64 units = 2;

  // Fractional units in billionths, in [-999_999_999, 999_999_999]. Must carry
  // the same sign as `units`. 0.75 USD is units=0, nanos=750_000_000.
  int32 nanos = 3;
}

// The explicit absence of a ceiling.
//
// This message carries no data and exists only so that "unlimited" has to be
// typed out. Budgets are required at thread creation precisely so an unbounded
// spend is a decision rather than a field somebody forgot, and a sentinel value
// like 0 or -1 would hand that decision straight back to the default.
message Unlimited {}

// A ceiling on a token count, or the explicit refusal to set one.
message TokenCeiling {
  oneof ceiling {
    uint64 tokens = 1;
    Unlimited unlimited = 2;
  }
}

// A ceiling on spend, or the explicit refusal to set one.
message CostCeiling {
  oneof ceiling {
    Money cost = 1;
    Unlimited unlimited = 2;
  }
}

// A ceiling on elapsed time, or the explicit refusal to set one.
message DurationCeiling {
  oneof ceiling {
    Duration duration = 1;
    Unlimited unlimited = 2;
  }
}

// A request for one page of a list endpoint.
message PageRequest {
  // Maximum items to return. Zero asks the satellite for its default page size.
  uint32 limit = 1;

  // Opaque cursor from a previous PageResponse. Empty starts at the beginning.
  string cursor = 2;
}

// Pagination state returned alongside a page of results.
message PageResponse {
  // Cursor to pass back for the next page. Empty means this was the last page.
  string next_cursor = 1;

  // Total matching items, when the satellite can count them without scanning.
  // Absent means the count was not computed, never that the total is zero.
  optional uint64 total = 2;
}
