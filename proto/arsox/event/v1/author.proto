syntax = "proto3";

package arsox.event.v1;

// Which tier of agent produced something.
//
// Structured rather than a display string, so a client can group a stream by
// member without parsing names. This is what lets a terminal render per-member
// panes and a host application attribute work. With team mode off there is one
// author and its kind is AGENT.
enum AuthorKind {
  AUTHOR_KIND_UNSPECIFIED = 0;

  // The single agent, when team mode is off.
  AUTHOR_KIND_AGENT = 1;

  AUTHOR_KIND_COMMANDER = 2;
  AUTHOR_KIND_MEMBER = 3;

  // A harness-native sub-agent running inside a member, the third tier.
  AUTHOR_KIND_SUBAGENT = 4;

  // The dedicated clean-context agents that run outside the team.
  AUTHOR_KIND_PLANNER = 5;
  AUTHOR_KIND_REVIEWER = 6;
  AUTHOR_KIND_SUGGESTIONS = 7;
}

// Who produced an event.
message Author {
  AuthorKind kind = 1;

  // Absent for authors that are not team members.
  optional string member_id = 2;

  // The role the commander assigned, e.g. "Frontend". Absent for authors that
  // are not team members.
  optional string role = 3;

  // The member that owns a sub-agent. Absent unless `kind` is SUBAGENT.
  optional string parent_member_id = 4;
}
