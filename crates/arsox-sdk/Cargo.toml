[package]
name = "arsox-sdk"
description = "Rust client and protobuf contract for Arsox satellites: one typed event stream, whichever harness runs underneath."
keywords = [ "arsox", "agents", "protobuf", "sdk" ]
categories = [ "api-bindings", "development-tools" ]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# The client is on by default, because a client is what most consumers want.
#
# The satellite depends on this crate for the generated types alone and takes
# `default-features = false`, so a server build never links an HTTP client it
# will not use. Features stay additive: enabling `client` adds items and removes
# nothing, per M-FEATURES-ADDITIVE.
default = [ "client" ]
client = [
  "dep:reqwest",
  "dep:tokio",
  "dep:tokio-tungstenite",
  "dep:futures-util",
  "dep:bytes",
]

[dependencies]
prost.workspace = true
prost-types.workspace = true

# The client half. Optional so a satellite can depend on this crate for the
# contract types alone and never link an HTTP stack it is already serving.
reqwest = { workspace = true, optional = true }
# `net` names the socket type the relay's two halves share.
tokio = { version = "1", default-features = false, features = [ "time", "net" ], optional = true }
tokio-tungstenite = { version = "0.24", features = [ "rustls-tls-webpki-roots" ], optional = true }
# `sink` splits the relay socket so answers can be sent from many tasks at once.
futures-util = { version = "0.3", features = [ "sink" ], optional = true }
# File transfers stream `Bytes`, the chunk type reqwest and hyper already speak,
# so a download can be forwarded into another HTTP body without a copy.
bytes = { version = "1", optional = true }

[lints]
workspace = true
