# Copyright © 2026 Jalapeno Labs

[package]
name = "arsox-satellite"
description = "The Arsox satellite: an HTTP and WebSocket API that runs agent harnesses and normalizes their output."
keywords = [ "arsox", "agents", "satellite", "server" ]
categories = [ "development-tools", "web-programming::http-server" ]
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# Test-only helpers, feature gated per M-TEST-UTIL so a stand-in harness cannot
# reach a published image.
test-util = [ ]

# The satellite itself.
[[bin]]
name = "arsox-satellite"
path = "src/main.rs"

# Replays a recorded transcript in place of a real CLI, so the turn runner can
# be exercised without a model, a network, or a token budget.
[[bin]]
name = "arsox-fake-harness"
path = "src/bin/fake_harness.rs"
required-features = [ "test-util" ]

[dependencies]
# Types only. The server has no use for the client half of the SDK, and linking
# it would drag an HTTP stack into a process that is already serving one.
arsox-sdk.workspace = true

anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true
axum.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
subtle.workspace = true
reqwest.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Notably faster along allocating hot paths, which for this process means
# request decoding and event fan-out. Per M-MIMALLOC-APPS.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
mimalloc = "0.1"

[lints]
workspace = true

[dev-dependencies]
# The client half of the SDK, so the satellite can be driven from a consumer's
# seat rather than only from the inside.
arsox-sdk = { path = "../arsox-sdk", features = [ "client" ] }
# A real WebSocket client, so the stream is tested over an actual socket rather
# than against a reimplementation of the handler's own logic.
tokio-tungstenite = "0.24"
