# node_modules rather than Plug'n'Play. The integration tests spawn a real
# satellite binary and drive it over a socket, and PnP's resolver only applies to
# processes Yarn itself starts. A plain node_modules tree behaves identically
# whether a file is run by Vitest, by `node`, or by a consumer who copied an
# example out of the README.
nodeLinker: node-modules
