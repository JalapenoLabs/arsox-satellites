[build-system]
requires = [ "hatchling==1.32.0" ]
build-backend = "hatchling.build"

[project]
name = "arsox-sdk"
version = "0.1.0"
description = "The Python client for an Arsox satellite. Protobuf on the wire, ordinary objects in your hands."
readme = "README.md"
license = "Apache-2.0"
authors = [ { name = "Jalapeno Labs" } ]
keywords = [ "arsox", "agents", "claude", "codex", "sdk" ]

# 3.10 is the floor every pinned tool here supports, and the version the suite
# runs against. `match` and PEP 604 unions both land at 3.10, so nothing in the
# package reaches for a newer syntax than the floor allows.
requires-python = ">=3.10"

# Exact pins, for the same reason every other tool version in this repository is
# exact: a floating dependency resolves differently on a developer's machine, in
# CI, and in production, and the difference surfaces as a bug nobody can
# reproduce.
dependencies = [
  # The runtime the checked-in gencode was generated by. `gen/python` is emitted
  # by protocolbuffers/python v33.1, whose gencode declares 6.33.1 and validates
  # only that the runtime is not older than itself. A 7.x runtime satisfies that
  # check too, so this pin is a choice rather than a constraint: matching the
  # gencode exactly is the version the contract was compiled against.
  "protobuf==6.33.1",

  # HTTP and WebSocket, from one dependency, natively async.
  #
  # The listing endpoints carry their filters in a protobuf request message on
  # GET, like every other request in the contract, so the client must be able to
  # put a body on a GET. The thread socket sits behind the same bearer check as
  # every other authenticated route, so it must be able to set a header on a
  # WebSocket handshake. aiohttp does both; the alternative was `websockets` for
  # the socket plus blocking `http.client` in a thread pool for everything else,
  # which is two dependencies and a thread hop to reach the same place.
  "aiohttp==3.14.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "mypy==2.3.1",
  "ruff==0.16.4",

  # The protobuf runtime ships no inline types, so mypy reads these instead. The
  # stub series tracks the runtime major it describes, which is why this is a 6.x
  # pin against a 6.33.1 runtime rather than the newest stubs published.
  "types-protobuf==6.32.1.20260221",
]

[project.urls]
Homepage = "https://github.com/JalapenoLabs/arsox-satellites"
Repository = "https://github.com/JalapenoLabs/arsox-satellites"

[tool.hatch.build.targets.wheel]
packages = [ "src/arsox_sdk" ]

# The synced contract is git ignored, and hatchling excludes VCS-ignored files by
# default, so the wheel would ship a client with no contract to speak. Naming it
# as an artifact is how a generated tree reaches a published package without
# being committed twice. See scripts/sync_proto.py.
artifacts = [ "src/arsox_sdk/proto/**" ]

[tool.ruff]
src = [ "src", "tests", "scripts" ]

# Generated code is not ours to style.
extend-exclude = [ "src/arsox_sdk/proto" ]

[tool.ruff.lint]
select = [ "E", "F", "I", "D" ]

# Line length is not strictly enforced, but lines stay reasonable.
ignore = [ "E501" ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
files = [ "src/arsox_sdk", "tests", "scripts" ]

# The generated modules are checked by their own `.pyi` stubs, which is what
# makes the contract typed at the boundary. They are excluded from checking
# because a strict pass over machine-written code reports things no human here
# can fix.
exclude = "^src/arsox_sdk/proto/"

[[tool.mypy.overrides]]
module = "arsox_sdk.proto.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = [ "tests" ]

# Every test in this package is async, so marking each one would be noise.
asyncio_mode = "auto"

# A loop per test. The client holds an aiohttp session bound to the loop that
# created it, and a session-scoped loop would hand one test's session to the
# next.
asyncio_default_fixture_loop_scope = "function"
