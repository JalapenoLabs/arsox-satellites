# The satellite image. Building it in CI is what keeps the Dockerfile honest:
# it names files by path, nothing else compiles it, and a crate moving directory
# breaks it silently until something actually runs `docker build`.
name: Docker

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docker/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and boot the satellite image
    runs-on: [ linux, rocky9, flagship, earthly, docker ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build the image
        run: docker build --tag arsox-satellite:ci-${{ github.sha }} .

      # A compile proves the builder stage. Booting proves the runtime stage:
      # the binary starts, finds every library it links, and serves liveness. A
      # missing shared object or a broken entrypoint passes the build and fails
      # only here.
      #
      # It also proves the part of the enforcement layer that needs Linux and
      # root, and therefore cannot be proven by the Rust suite: the satellite
      # boots as root and resolves the agent account it hands children down to.
      # Both have to hold, and a satellite that is not root enforces nothing.
      #
      # The uid a spawned child actually lands on is not asserted here, because
      # observing one means driving a turn, which is a longer smoke than this
      # step is. It is covered by the unit tests on the decision plus the boot
      # line below, and a turn-driving smoke is worth adding on its own.
      - name: Boot the image and check liveness
        run: |
          set -euo pipefail

          container=$(docker run --detach --rm \
            --env ARSOX_SECRET=ci-smoke-secret \
            --publish 127.0.0.1:18080:8080 \
            arsox-satellite:ci-${{ github.sha }})
          trap 'docker stop "$container" > /dev/null' EXIT

          live=""
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/healthz > /dev/null; then
              live="yes"
              break
            fi
            sleep 1
          done

          if [ -z "$live" ]; then
            echo "satellite never became live" >&2
            docker logs "$container" >&2
            exit 1
          fi
          echo "satellite is live"

          # Read off PID 1 rather than off `docker exec`, which reports the
          # image's configured user rather than the identity the satellite
          # actually booted under. Through /proc rather than `ps`, which the
          # runtime image has no reason to carry.
          entrypoint_uid=$(docker exec "$container" sh -c "grep '^Uid:' /proc/1/status | cut -f2")
          if [ "$entrypoint_uid" != "0" ]; then
            echo "the satellite booted as uid $entrypoint_uid, so nothing it owns is beyond an agent's reach" >&2
            exit 1
          fi

          # The boot log states the posture it resolved. Root without the agent
          # account enforces nothing either, and says so rather than dropping
          # decoratively.
          if ! docker logs "$container" 2>&1 | grep -q "satellite.boot.enforcement_ready"; then
            echo "the satellite did not report a working enforcement posture" >&2
            docker logs "$container" >&2
            exit 1
          fi

          echo "satellite runs as root and reports enforcement ready"

      # The Blender variant extends the image just built, so it is built here
      # rather than in a job of its own that would rebuild the base.
      - name: Build the Blender image
        run: |
          docker build --file docker/blender/Dockerfile \
            --build-arg BASE_IMAGE=arsox-satellite:ci-${{ github.sha }} \
            --tag arsox-satellite:ci-${{ github.sha }}-blender .

      # Booting proves what the build cannot: Blender finds every library it
      # loads, the extension starts its bridge, and the MCP server answers with
      # its tools. It also holds the variant to the base image's posture: the
      # satellite is still PID 1 as root, and the Blender services run as the
      # agent account, because the bridge executes whatever Python it is sent.
      - name: Boot the Blender image and check its tools
        run: |
          set -euo pipefail

          container=$(docker run --detach --rm \
            --env ARSOX_SECRET=ci-smoke-secret \
            arsox-satellite:ci-${{ github.sha }}-blender)
          trap 'docker stop "$container" > /dev/null' EXIT

          tools=""
          for _ in $(seq 1 60); do
            tools=$(docker exec "$container" curl --silent --fail --request POST http://127.0.0.1:9877/ \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' || true)
            if echo "$tools" | grep -q '"execute_blender_code"'; then
              break
            fi
            sleep 1
          done

          if ! echo "$tools" | grep -q '"execute_blender_code"'; then
            echo "the Blender MCP server never listed its tools" >&2
            docker logs "$container" >&2
            exit 1
          fi

          # A live-session call reaches the bridge inside Blender, so it proves
          # the extension is installed, enabled, and listening, not just the server.
          call='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"execute_blender_code",'
          call="$call"'"arguments":{"code":"import bpy\nresult = {'"'"'version'"'"': bpy.app.version_string}"}}}'
          answer=$(docker exec "$container" curl --silent --fail --request POST http://127.0.0.1:9877/ \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data "$call")
          if ! echo "$answer" | grep -q 'status.*ok'; then
            echo "the Blender bridge did not run code: $answer" >&2
            docker logs "$container" >&2
            exit 1
          fi

          entrypoint_uid=$(docker exec "$container" sh -c "grep '^Uid:' /proc/1/status | cut -f2")
          if [ "$entrypoint_uid" != "0" ]; then
            echo "the satellite booted as uid $entrypoint_uid" >&2
            exit 1
          fi

          # By process name rather than command line, which would also match
          # this very check's own shell.
          blender_uids=$(docker exec "$container" sh -c \
            'for status in /proc/[0-9]*/status; do
               case "$(sed -n "s/^Name:\t//p" "$status")" in
                 blender|blender-mcp) grep "^Uid:" "$status" | cut -f2 ;;
               esac
             done' | sort -u)
          if [ "$blender_uids" != "10001" ]; then
            echo "the Blender services run as uid(s) '$blender_uids', not the agent account" >&2
            exit 1
          fi

          echo "Blender and its MCP server answer, as the agent account"

      # The image is rebuilt from scratch next run either way; leaving CI tags
      # behind on a persistent runner just accumulates disk.
      - name: Remove the CI tags
        if: always()
        run: |
          docker rmi --force arsox-satellite:ci-${{ github.sha }}-blender || true
          docker rmi --force arsox-satellite:ci-${{ github.sha }} || true
